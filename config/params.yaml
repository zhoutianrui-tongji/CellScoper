# CellScoper 默认配置
# ============================================================
# 设计要点：
# 1. 无监督发现亚细胞结构：MetaSpot -> 空间基因嵌入 + LENS -> MetaDomain 发现（不依赖参考基因）
# 2. 注释（结构轴）是下游一步：每类结构用留出标志基因在本数据上检验，未通过的单独标出
# 3. 每个细胞的结构量输出到 cell_structure_features.parquet
# 4. 不使用 overlaps_nucleus 作为模型输入，核内外由细胞核边界推断
# 5. 适合作为 Xenium / Atera / MERFISH / CosMx 等平台的通用起点
#
# 注意：
# - YAML 中以 "#" 开头的内容均为注释，不参与程序解析
# - 如果换数据平台，优先微调 annotation，而不要先动 geometry / MetaSpot / LENS


# ============================================================
# I/O 与运行输出
# ============================================================

io:
  # 默认打开（关闭设 false）：输出"细胞 × 结构"特征表 cell_structure_features.parquet
  # （cellscoper/cell_features.py: structure_feature_table；需要注释）。每个细胞每一侧、每种结构和每个 MetaDomain 一行：带标签的 MetaSpot / 转录本比例，以及没有深度偏差的成对共定位比值（单细胞噪声大，
  # 比较细胞群体时用 sum(pair_obs) / sum(pair_exp)）。
  cell_structure_features: true
  # 最终 transcript-level 输出格式
  final_format: parquet

  # h5ad 压缩方式
  h5ad_compression: lzf

  # 默认恢复策略
  # minimal：尽可能复用已有 checkpoint
  resume_policy: minimal

  # null 表示由程序自动判断恢复位置
  resume_from: null

  # 中间结果目录名称
  intermediate_dirname: intermediate_results

  # 是否额外保存 CSV 版本
  write_csv_copy: false

  # 是否保存中间结果
  write_intermediate: true

  # 使用轻量化中间结果，减少磁盘占用
  lite_intermediate: true

  # 中间结果是否保存 CSV
  write_intermediate_csv: false

  # 中间结果是否保存 Parquet
  write_intermediate_parquet: false

  # 是否保存诊断图
  write_intermediate_figures: true

  # 是否保存诊断表
  write_diagnostic_tables: false

  # 诊断表保存 CSV
  write_diagnostic_csv: false

  # 诊断表保存 Parquet
  write_diagnostic_parquet: false

  # 是否在 final_data.parquet 之外额外写一套分区 Parquet 数据集
  write_partitioned_dataset: false

  # 是否计算输入文件 hash，用于可复现性追踪
  provenance_hash_inputs: true

  # 最终 adata1.h5ad 是否只保留 X_lens 一种 MetaSpot 表示（去掉 X_gene_embedding），减小文件
  drop_embeddings: false


# CLI 启动时是否展示输入样例
show_sample: true


# ============================================================
# Automatic scale-aware execution
# ============================================================

execution:
  # exact <= 200k MetaSpots; sampled <= 2M; streaming above 2M.
  profile: auto
  exact_max_metaspots: 200000
  sampled_max_metaspots: 2000000
  partition_rows: 1000000


# ============================================================
# Module 1
# Transcript-level 几何特征
# ============================================================

module1:
  # 是否计算方向性几何特征
  include_directional: true

  # 重要：
  # false 表示不直接使用输入中的 overlaps_nucleus 作为预测依据
  # 而是根据 nucleus boundary 自己推断核内外位置
  # 评估时必须保持 false，避免使用真值造成信息泄漏
  use_input_nucleus_flags: false

  # 是否在分析前去除"外来转录本"（分割不准时混入的相邻细胞转录本）
  # 做法：先把细胞粗分成若干类型；某基因在本细胞类型中的表达量
  # 不超过表达最高类型的 foreign_max_relative_expression 时，视为外来并去除
  # 默认开启：不去除时，混入的转录本会被当成亚细胞结构
  # 稀疏铺开、互不接触的培养细胞可以关闭
  remove_foreign_transcripts: true
  foreign_max_relative_expression: 0.2

  # 到细胞/细胞核边界的距离定义
  # vertex：到最近边界顶点的距离（历史行为，默认）
  # edge：到多边形边的精确距离；顶点稀疏时更准确
  boundary_distance: vertex

  # 几何特征 winsorization 下界百分位
  winsor_perc_low: 1

  # 几何特征 winsorization 上界百分位
  winsor_perc_high: 99


# ============================================================
# Module 2
# 局部表达组成 embedding
# ============================================================

module2:
  # 每个转录本用"最近 bow_knn_k 个同细胞转录本中、最常见的 top_g 个基因"的距离加权词袋描述，
  # 做 TF-IDF 后用稀疏随机投影降到 svd_n_components 维；模型在 Module 3 里逐细胞使用，不生成全局大表。
  top_g: 1024
  bow_knn_k: 12
  svd_n_components: 24
  # 估计 IDF 时抽样：最多这么多个细胞、每个细胞最多这么多个转录本、总共最多这么多行
  svd_sample_cells: 5000
  max_rows_per_cell_for_svd: 256
  max_svd_rows: 100000
  # 并行处理时每个任务包含的细胞数
  parallel_chunk_cells: 8
  # 是否用 TF-IDF、是否做 TF 归一化、IDF 计算方式（log1p / log / none）
  use_tfidf: true
  tf_norm: true
  idf_mode: log1p
  # 邻居权重：gaussian / inv / uniform
  bow_weight_mode: gaussian


# ============================================================
# Module 3
# MetaSpot 分割
# ============================================================

module3:
  # Module 3 uses a persistent executor.  A larger batch avoids scheduler and
  # garbage-collection overhead on hundreds of thousands of cells.
  parallel_chunk_cells: 256

  # Validated on the 1W workload; still bounded by runtime.n_jobs and affinity.
  parallel_n_jobs: 12

  # 有 z_location 时，MetaSpot 也按高度划分（三维连通和 Ward 聚类）；每个细胞的 MetaSpot 数仍按 x-y 位点数定。
  use_z_location: true

  # MetaSpot = 细胞一侧（核内或核外分开切，MetaSpot 不跨越核膜）内空间连通的一块，空间约束 Ward 聚类，
  # 特征为几何 + Module 2 局部基因组成（2k-cell Xenium 审计：分侧切分让核质准确率 0.896 -> 0.951）。

  # 核心 MetaSpot 粒度参数：平均约每 target_sites_per_metaspot 个不同的 x-y 位点形成一个 MetaSpot。
  # 过粗的 MetaSpot 会把细结构与核/质背景混在一起。
  target_sites_per_metaspot: 15

  # 每个细胞最少 MetaSpot 数
  min_metaspots_per_cell: 20

  # 每个细胞最多 MetaSpot 数
  max_metaspots_per_cell: 1000

  # 空间连通图 kNN
  spatial_connectivity_k: 8

  # 用于估计空间连通半径的距离分位数
  spatial_radius_quantile: 0.9

  # 连通半径放大系数
  spatial_radius_factor: 1.5

  # MetaSpot 标签空间平滑次数
  spatial_smoothing_iterations: 1

  # 空间平滑时邻域最小一致比例
  spatial_smoothing_min_fraction: 0.6

  # 太小的空间 component 会被合并
  spatial_min_component_size: 5

  # 空间紧致度权重
  spatial_compactness: 1.0

  # 用于 MetaSpot 分割的表达/几何特征维数（取方差最大的这么多个）
  n_segmentation_features: 24
  # MetaSpot 分割的几何部分。legacy：组成特征 + 径向距离（3 个近乎相同的列）+ 绕核夹角 + 密度，取方差最大的列；
  # isotropic：只用局部组成 + 密度，空间紧致性只来自坐标（各方向等权），坐标占总方差的份额 = segmentation_spatial_share。
  segmentation_geometry: legacy
  segmentation_spatial_share: 0.333
  # 细胞一侧少于这么多个转录本时整体作为一个 MetaSpot；也是未设 spatial_min_component_size 时的最小块大小
  min_segment_points: 30

  # 不超过该细胞数时用线程而非进程。分割是纯 Python 计算，线程受 GIL 限制：
  # 1000 个全转录组细胞用线程或顺序处理要 4-5 分钟，用进程约 20 秒，结果相同。
  small_backend_cells: 32

  # 顺序处理细胞阈值
  sequential_cells: 32


# ============================================================
# Module 5
# MetaSpot 表示（GE、LENS）与 MetaDomain
# ============================================================

module5:
  # ---- MetaSpot 表示：空间基因嵌入（GE，X_gene_embedding）和 LENS（MetaSpot 掩码转录本模型，X_lens）----
  # 注释同时读 GE 和 LENS；MetaDomain 只用 LENS。
  # LENS 最多训练轮数；按留出细胞的预测提升提前停止（5k 约 70–80 轮停止）。需要 GPU（无 GPU 时用 CPU，很慢）。
  lens_max_epochs: 200
  # LENS 抽样训练：每轮只训练这么多个随机 MetaSpot，训练时间不随数据量增长（全数据用）；0 = 每轮用全部 MetaSpot。
  # 提前停止改按"见过的 MetaSpot 数"计（400 万个无提升即停，最多 1 亿个）。
  lens_spots_per_epoch: 0
  # 训练结束后，再把最多这么多个随机细胞的基因在细胞内打乱并编码一次，作为结构轴和 MetaDomain 发现的空模型。
  lens_null_cells: 10000
  # LENS 预测被遮转录本时的背景组成 B：learned = 本细胞组成、低秩轮廓与全片组成的可学混合（原版）；
  # own = 只用本细胞本侧组成（去掉该 MetaSpot，向本细胞低秩轮廓收缩 10 个伪计数），没有全片成分，
  # LENS 只能学“这个位置与本细胞平均的差别”，不学细胞类型组成（打乱输入后不再认得参考基因）。annotation.evidence_label_rule: lens_count 需要 own。
  # 默认 own（v1.0.0 起）。
  lens_background: own
  # LENS 每条转录本是否输入它在细胞里的绝对径向位置（到核、到细胞膜的相对距离）。false = 只留核/质标记和相对 MetaSpot 的位置。
  # 本细胞背景（own）下径向位置会占满 z、盖过周围基因的信息（模拟数据上）；真实数据的留出标签不变。
  # 默认 false（v1.0.0 起）。
  lens_absolute_position: false

  # 空间基因嵌入：学嵌入的配对半径、取邻居半径，单位与输入坐标相同；有 z_location 时按 3D 距离。
  # auto：取数据 x-y 平面"最近邻转录本中位距离"的倍数，不依赖坐标单位（µm / 像素均可）。
  gene_embedding_pair_radius: auto
  gene_embedding_neighbour_radius: auto
  # multiscale（默认）：在 3、7、14 倍转录本平均间距三个尺度上各做一次基因嵌入后拼接，不需要选半径。
  # density：只用 10 倍间距。
  gene_embedding_scale: multiscale
  gene_embedding_dim: 32
  # 转录本少于此数的基因不学向量；稀有配对向"无关联"收缩的伪计数
  gene_embedding_min_gene_count: 100
  gene_embedding_pseudo_count: 5.0
  # 学嵌入最多用多少个细胞（全部转录本仍会得到邻居向量）
  gene_embedding_max_cells: 20000

  # 随机种子（LENS 训练和 MetaDomain 发现）
  random_seed: 42

  # ---- MetaDomain：从 LENS 无参考发现（cellscoper/metadomain_discovery.py）----
  # 从 LENS 的 z 找出比基因打乱对照更密集、
  # 两半细胞都能重复的方向（HDBSCAN）；数量由数据决定，不属于任何 MetaDomain 的 MetaSpot 为背景（meta-domain = -1）。
  # 核内、胞质一起聚类（门槛按侧和深度分档）：分开聚类会在 2D 核轮廓两侧造出"镜像"结构域。每个 MetaDomain
  # 报告核内比例和核边界检查（adata1.uns["metadomain_discovery"]）。需要 lens_null_cells > 0。
  # 基因打乱的输入上找不到 MetaDomain。
  # 发现时允许的假阳性比例（与结构轴 evidence_axis_q 相同的含义）。
  metadomain_q: 0.2

# ============================================================
# Module 6
# MetaDomain 聚合
# ============================================================

module6:
  # 是否覆盖 h5ad compression 设置
  h5ad_compression_override: true

  # 是否保存 MetaDomain 几何形状摘要
  save_shape_summary: true



# ============================================================
# Annotation
# 证据注释（细胞内置换零分布 + 留出标志基因检验）
# ============================================================

annotation:
  # 开启亚细胞注释（设为 false 或 method: none 跳过注释）
  enable: true
  # 注释方法：evidence（结构轴规则，cellscoper/structure_axes.py）。输出列：
  #   subcellular_annotation              最终标签：分数超过门槛的 MetaSpot 标为该结构，其余为 Nucleus / Cytosol
  #   subcellular_annotation_support      可信度：segmentation（核/质，来自核分割）、validated（该结构在本数据上
  #                                       通过留出基因检验）、unvalidated（未通过）
  #   subcellular_annotation_validated    只含通过留出基因检验的结构
  #   subcellular_annotation_exploratory  检验标准放宽一档
  # 每个 MetaSpot 对每种结构有一个连续分数：参考标志基因只给出方向（GE 和 LENS 解码器里），分数在同一细胞侧
  # 相邻 MetaSpot 上平均；门槛来自细胞内打乱基因的空模型，按估计的假标签比例定；留出检验只报告，不改变标签。
  method: evidence

  # 结构分数从哪里读：auto（跑了 LENS 时用 ge+lens，否则 ge）、ge、lens、ge+lens。
  evidence_axis_source: auto
  # 每种结构允许的假标签比例；达不到的结构记为未检出，不打标签。
  evidence_axis_q: 0.2
  # 分数在同一细胞侧的相邻 MetaSpot 上平均，平均范围约这么多个转录本（按转录本数定，换平台不用改）。
  evidence_axis_smooth_transcripts: 50
  # 胞质分数在定阈值前，按到细胞边界的距离分这么多个等人数档，档内减去均值（去掉群体共有的由外到内趋势）。0 = 关闭。
  evidence_axis_radial_bands: 0
  # 最终标签的规则：axis = 结构轴（细胞内对比）；lens_count（v1.0.0 起默认） = 每个细胞标多少由 LENS 计数决定（全片一个 Otsu 阈值，
  # 跨细胞可比），标在哪里按计数证据与结构轴分数的细胞内排名平均；结构须过 LENS 门槛（留出参考基因 vs 表达匹配随机基因集 z >= 3）。
  # lens_count 需要 module5.lens_background: own。见 cellscoper/lens_count.py。
  evidence_label_rule: lens_count
  # 留出基因检验：折数、自助抽样次数、用多少个细胞（每折都要重算表示，只影响报告）。
  evidence_validation_folds: 5
  evidence_bootstrap: 2000
  evidence_axis_validation_cells: 3000
  # 打乱基因的空模型只在随机抽取的这么多细胞上算门槛；分数和标签仍覆盖全部细胞。
  evidence_max_cells: 10000
  # 基因在该区室内至少有这么多转录本才参与留出检验。
  evidence_min_gene_transcripts: 50
  # 参考基因归入某一结构所需的领先幅度（0-1 归一化得分）。
  evidence_marker_margin: 0.2
  # 数据门槛：基因核内偏好在两半细胞间的 Spearman 相关低于该值时，判定数据不具备亚细胞分辨率，
  # 只输出 Nucleus/Cytosol。
  evidence_min_resolution: 0.3
  evidence_seed: 0


# ============================================================
# Runtime
# ============================================================

runtime:
  # CellScoper 内部并行任务数量
  n_jobs: 12

  # 大规模 Module 3 使用进程绕过 Python GIL；小数据仍自动使用线程
  joblib_backend: loky

  # 每个 worker 内 BLAS 保持单线程，避免嵌套线程池
  blas_threads: 1

  # Numba 内层线程；会按 OpenBLAS 64 线程元数据上限安全截断
  numba_threads: 4

  # 导入时设置的 SCANPY_N_JOBS 环境变量上限（流程本身不用 scanpy，给同一进程里的下游分析用）
  scanpy_n_jobs: 4

  # 使用 threadpoolctl 防止线程过度嵌套
  use_threadpoolctl: true
